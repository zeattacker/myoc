services:
  openclaw-gateway:
    build:
      context: .
      additional_contexts:
        qmd_src: ~/Documents/Projects/qmd
        llama_src: ~/Documents/Projects/llm/llcp/llama.cpp
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KIMI_BOT_TOKEN: ${KIMI_BOT_TOKEN:-}
      MC_SERVER_URL: http://mission-control:8001
      GOG_KEYRING_PASSWORD: openclaw-gog-keyring
      GOG_ACCOUNT: finance@gamatecha.com
      PATH: /home/node/.openclaw/bin:/home/node/.npm-global/bin:/home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Lobster workflow shell env vars
      CLAWD_URL: "http://127.0.0.1:18789"
      CLAWD_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      LOBSTER_STATE_DIR: /home/node/.openclaw/workspace/lobster-state
    volumes:
      - ~/.config/gogcli:/home/node/.config/gogcli
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ${OPENCLAW_CONFIG_DIR}/ssh:/home/node/.ssh
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/Documents/Projects/oc-skills:/home/nvidia/Documents/Projects/oc-skills:ro
      # QMD model cache — persists GGUF models across container recreates
      - ${OPENCLAW_CONFIG_DIR}/qmd/cache/.cache/qmd/models:/home/node/.cache/qmd/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "988" # Host docker group GID for docker socket access
    init: true
    restart: unless-stopped
    command:
      [
        "node", "dist/index.js", "gateway",
        "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port", "18789"
      ]

  mission-control:
    build:
      context: ../mission-control
      dockerfile: Dockerfile
    ports:
      - "${MISSION_CONTROL_PORT:-8080}:8080"
      - "${PLAN_API_PORT:-8001}:8001"
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/nvidia/.openclaw:ro
      - ${OPENCLAW_WORKSPACE_DIR}:/home/nvidia/.openclaw/workspace  # writable for edit
    environment:
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_TASKS_DIR=/home/nvidia/.openclaw/workspace
      - OPENCLAW_AGENTS_DIR=/home/nvidia/.openclaw/agents
      - PLAN_FILE=/home/nvidia/.openclaw/workspace/plan.json
      - PLAN_MEMORY_DIR=/home/nvidia/.openclaw/workspace/plan_memory
    depends_on:
      - openclaw-gateway
    restart: unless-stopped

  pinchtab:
    image: pinchtab/pinchtab
    security_opt:
      - seccomp:unconfined
    environment:
      BRIDGE_TOKEN: ${PINCHTAB_TOKEN:-}
      BRIDGE_BLOCK_ADS: "true"
    volumes:
      - ${OPENCLAW_CONFIG_DIR}/pinchtab:/root/.pinchtab
    ports:
      - "9867:9867"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=Authorization: Bearer ${PINCHTAB_TOKEN}", "http://localhost:9867/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
